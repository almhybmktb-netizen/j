name: Run Bot

on:
  schedule:
    - cron: '*/5 * * * *'   # كل 5 دقائق (عدّل حسب الحاجة)
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD_BASE: ${{ secrets.PASSWORD_BASE }}
          MAX_ATTEMPTS: ${{ secrets.MAX_ATTEMPTS }}
        run: python bot.py

      - name: Commit and push progress file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sh.txt          # ← تم التعديل من sh.json إلى sh.txt
          git diff --staged --quiet || git commit -m "Update sh.txt progress"
          git push
        continue-on-error: true   # يستمر حتى لو لم يتغير الملف
